<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox centralizado</title>
    <style>
        * {
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }

        body {
            background-color: lightsalmon;
        }

        main {
            background-color: lightgreen;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        section {
            background-color: lightseagreen;
            width: 200px;
            height: 200px;
        }
    </style>
</head>
<body>
    <main>
        <section>
            <h1>Tela de login</h1>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Blanditiis nihil ipsa hic corporis itaque. Explicabo aperiam odit corrupti! Dolorum odit, nisi officiis id excepturi itaque necessitatibus modi vitae. Consequatur, dicta.</p>
        </section>
    </main>
</body>
</html>
