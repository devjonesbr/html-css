<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        .conteiner {
            background-color: lightsalmon;
            display: flex;
            flex-flow: row nowrap;
        }

        .item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 400px;
        }

        #xd1 {
            flex-grow: 1;
            flex-shrink: 0;
        }

        #xd2 {
            flex-grow: 1;
            flex-shrink: 2;
        }

        #xd3 {
            flex-grow: 1;
            flex-shrink: 3;
        }

    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="xd1">A</div>
        <div class="item" id="xd2">B</div>
        <div class="item" id="xd3">C</div>
    </div>
</body>
</html>
