<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe {
            border: 10px dashed black;
            width: 400px;
            height: 350px;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>Acessando o site
        
        <iframe src="https://www.cursoemvideo.com" frameborder="1" scolling="no" width="300px" height="300px">do <a href="https://www.cursoemvideo.com" target="_blank">CursoemVideo</a></iframe>
        
        para aprender a programar</p>
        <p>O site <iframe src="https://gustavoguanabara.github.io" frameborder="1" scolling="yes" width="300px" height="300px">do <a target="_blank" href="https://gustavoguanabara.github.io">Guanabara</a></iframe> também é bom.</p>
</body>
</html>
